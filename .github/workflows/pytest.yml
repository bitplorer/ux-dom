name: pytest

on:
  pull_request:
  push:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      # Browser tests must run in CI; a missing toolchain fails, never skips.
      UX_DOM_REQUIRE_BROWSER: "1"
      # ux-channel integration tests must run too (same pin as ux-compose).
      UX_DOM_REQUIRE_CHANNEL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install --with dev,test --no-interaction --no-ansi
      - name: Install pinned ux-channel (integration tests)
        run: >-
          poetry run pip install
          "ux-channel @ git+https://github.com/bitplorer/ux-channel.git@f1a93fcf298c97a59fa6538697731e19aac8586d#subdirectory=python"
      - name: Install browser test toolchain (Playwright + Chromium)
        run: |
          npm ci --prefix tests/browser
          npx --prefix tests/browser playwright install --with-deps chromium
      - name: Run pytest
        run: poetry run pytest tests/ -q -rs
