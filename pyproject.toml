[tool.poetry]
name = "ux-dom"
version = "0.2.0"
description = "ux-dom — Python hypermedia render library (tree → HTML / stream)"
authors = ["bitplorer <bitplorer@outlook.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/bitplorer/ux-dom"
repository = "https://github.com/bitplorer/ux-dom"
documentation = "https://github.com/bitplorer/ux-dom/tree/main/docs"
keywords = ["hypermedia", "htmx", "dom", "server-driven-ui", "fastapi", "web-components"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Framework :: FastAPI",
  "Typing :: Typed",
]
packages = [
  { include = "ux_dom", from = "src" },
]
include = [
  "src/ux_dom/py.typed",
  "src/ux_dom/scripts/*.js",
  "src/ux_dom/**/*.js",
  "src/ux_dom/**/*.css",
  "src/ux_dom/**/*.html",
]

[tool.poetry.dependencies]
python = ">=3.14,<3.15"
Jinja2 = ">=3.1.6,<4"
# 0.1.0b6 works with the in-tree PEP 649 compat layer (ux_dom.compat).
# Prefer ≥0.1.0b7 once published (native PEP 649 fix in valio).
valio = ">=0.1.0b6,<0.2"
marko = ">=2.0,<3"
typer = ">=0.12,<1"
# Imported directly by ux_dom.compat.valio_pep649; declared, not borrowed from valio.
typingx = ">=0.6.0,<0.7"

# Optional runtime extra: fastapi brings starlette, which ux_dom.response.starlette
# imports, and plugins.safe_static.install_safe_static imports when called.
# Extras carry only packages src/ux_dom imports (ADR 0003 rule 2).
fastapi = { version = ">=0.115.0", optional = true }

[tool.poetry.extras]
fastapi = ["fastapi"]

[tool.poetry.group.dev.dependencies]
black = ">=24.0.0"
mypy = ">=1.10.0"
ruff = ">=0.6.0"
uvicorn = { extras = ["standard"], version = ">=0.30.0" }
starlette = ">=0.46.0"
fastapi = ">=0.115.0"
deptry = ">=0.20.0"
pipdeptree = ">=2.20.0"
httpx = ">=0.27.0"

[tool.poetry.group.test.dependencies]
pytest = ">=8.0.0"
pytest-asyncio = ">=0.24.0"
toml = ">=0.10.2"
types-toml = ">=0.10.8"
hypothesis = ">=6.100"

[tool.poetry.scripts]
uxdom = "ux_dom.cli:app"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".", "tests"]
asyncio_mode = "auto"
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
mypy_path = "src"
exclude = [
  "ux_dom/elements/",
]

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
branch = false
source = ["ux_dom"]
omit = [
  "ux_dom/elements/*",
  "ux_dom/alpinejs/*",
  "*/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
fail_under = 70
