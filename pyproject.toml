[tool.poetry]
name = "ux-dom"
version = "0.2.0"
description = "ux-dom — Python hypermedia render library (tree → HTML / stream)"
authors = ["bitplorer <bitplorer@outlook.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/bitplorer/ux-dom"
repository = "https://github.com/bitplorer/ux-dom"
documentation = "https://github.com/bitplorer/ux-dom/tree/main/docs"
keywords = ["hypermedia", "htmx", "dom", "server-driven-ui", "fastapi", "web-components"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Framework :: FastAPI",
  "Typing :: Typed",
]
packages = [
  { include = "ux_dom", from = "src" },
]
include = [
  "src/ux_dom/py.typed",
  "src/ux_dom/scripts/*.js",
  "src/ux_dom/**/*.js",
  "src/ux_dom/**/*.css",
  "src/ux_dom/**/*.html",
]

[tool.poetry.dependencies]
python = ">=3.14,<3.15"
Jinja2 = ">=3.1.6,<4"
# ux_dom.dom.src.ext imports markupsafe.Markup directly (not only via Jinja2).
MarkupSafe = ">=2.0,<4"
marko = ">=2.0,<3"
typer = ">=0.12,<1"
# ux_dom.elements validates fields with ux-valio. Pinned to an exact commit
# (ADR 0004 lockstep); bump the SHA with the ux-valio change it needs.
ux-valio = { git = "https://github.com/bitplorer/ux-valio.git", rev = "4982d80c92413e8409a15b279c12c9b8b371a41b" }

# Optional runtime extra: fastapi brings starlette, which ux_dom.response.starlette
# imports, and plugins.safe_static.install_safe_static imports when called.
# Extras carry only packages src/ux_dom imports (ADR 0003 rule 2).
fastapi = { version = ">=0.115.0", optional = true }

[tool.poetry.extras]
fastapi = ["fastapi"]

[tool.poetry.group.dev.dependencies]
black = ">=24.0.0"
mypy = ">=1.10.0"
ruff = ">=0.6.0"
uvicorn = { extras = ["standard"], version = ">=0.30.0" }
starlette = ">=0.46.0"
fastapi = ">=0.115.0"
deptry = ">=0.20.0"
pipdeptree = ">=2.20.0"
httpx = ">=0.27.0"

[tool.poetry.group.test.dependencies]
pytest = ">=8.0.0"
pytest-asyncio = ">=0.24.0"
toml = ">=0.10.2"
types-toml = ">=0.10.8"
hypothesis = ">=6.100"

[tool.poetry.scripts]
uxdom = "ux_dom.cli:app"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".", "tests"]
asyncio_mode = "auto"
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
mypy_path = "src"
exclude = [
  "ux_dom/elements/",
]

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
branch = false
source = ["ux_dom"]
omit = [
  "ux_dom/elements/*",
  "ux_dom/alpinejs/*",
  "*/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
fail_under = 70

# Code map (scripts/codemap.py, docs/internals/CODEMAP.md). Paths are repo-relative.
[tool.codemap]
packages = ["src/ux_dom"]
out_dir = "docs/internals/codemap"
assets = ["src/ux_dom/**/*.js", "src/ux_dom/**/*.css"]
features = "docs/internals/features.toml"
domain = "docs/internals/domain.toml"
narrative = [
  "docs/internals/ARCHITECTURE.md",
  "docs/internals/SYSTEM.md",
  "docs/internals/MODULE_MAP.md",
]
# Docs whose reference-style claims are indexed and resolved against the code
# (findings only, never failed; see CODEMAP.md "Doc claims").
claims_docs = ["README.md", "AGENTS.md", "START_HERE.md", "CONTRIBUTING.md", "INSTALL.md", "docs"]
# ADRs and plans are history: they name removed code on purpose.
claims_exclude = ["docs/archive", "docs/plans", "docs/adr"]
# The map's own doc and tests name modules only to describe the map; counting
# them would churn shards whenever an example or allowlist there changes.
self_files = [
  "docs/internals/CODEMAP.md",
  "tests/04_production/test_codemap.py",
  "tests/04_production/test_codemap_fixtures.py",
]
# Known module-level cycle, ledger E4 (https://github.com/bitplorer/ux-dom/issues/59).
allowed_cycles = [["ux_dom.dom.src.dom_tag", "ux_dom.dom.src.utils.dom_util"]]
# Rule-breaking edges accepted on purpose: "importer -> imported". Say why.
layer_exceptions = [
  # The Htmx Document facade installs HtmxMiddleware for its host.
  "ux_dom.plugins.control.htmx -> ux_dom.htmx.middleware",
]

[tool.codemap.consumers]
docs = [".md"]
examples = [".py", ".md", ".html", ".js", ".mjs"]
standalone = [".py", ".md", ".html", ".js", ".mjs"]
tests = [".py", ".md", ".html", ".js", ".mjs"]

[tool.codemap.public_api]
rule = "all_or_derived"
packages = ["ux_dom"]

# Module prefix -> layer (longest prefix wins; the package root ``ux_dom``
# matches only itself, and a module matching nothing fails the build). Extends
# the package ontology in AGENTS.md: dom (tags / serialize), document
# (Document, contributions, runtime facades, package static), components
# (typed trees on top of dom), ui (optional kit), cli (pure-dom Typer CLI),
# integrations (HTTP / ASGI / IO adapters), support (shared helpers).
[tool.codemap.layers]
"ux_dom" = "root"
"ux_dom.__main__" = "cli"
"ux_dom.alpinejs" = "components"
"ux_dom.cli" = "cli"
"ux_dom.concurrency" = "support"
"ux_dom.diagnostics" = "support"
"ux_dom.dom" = "dom"
"ux_dom.elements" = "components"
"ux_dom.htmx" = "integrations"
"ux_dom.plugins" = "document"
"ux_dom.profiling" = "support"
"ux_dom.response" = "integrations"
"ux_dom.scripts" = "document"
"ux_dom.settings" = "document"
"ux_dom.slots" = "components"
"ux_dom.ui" = "ui"
"ux_dom.utils" = "support"
"ux_dom.web_io" = "integrations"

# Layer -> other layers it may import at module or function level (its own
# layer is always allowed; TYPE_CHECKING imports are exempt). ``dom`` is ledger
# E9 (#59). The rest pin today's graph so any new cross-layer edge is reviewed.
[tool.codemap.layer_rules]
cli = ["document", "dom", "root", "support", "ui"]
components = ["dom"]
document = ["dom"]
dom = ["support"]
integrations = ["document", "dom"]
root = ["components", "document", "dom"]
support = ["dom"]
ui = ["dom", "root"]
