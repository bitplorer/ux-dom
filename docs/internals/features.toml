# Features registry (curated). scripts/codemap.py validates every reference:
# modules and assets must be mapped, ``symbols`` (``module:Name`` or
# ``module:Class.method``) must resolve, and ``tests`` / ``docs`` paths must
# exist (``path::Class::test`` nodes are checked too). The validated entries are
# folded into codemap/index.json, and each module shard lists its features.
# Edit this file in the same PR that moves a feature. See CODEMAP.md.

[[feature]]
id = "tag-tree"
purpose = "Build HTML trees from tag classes and `with` blocks, with per-root locks and node membership."
modules = [
  "ux_dom.dom",
  "ux_dom.dom.src.dom_tag",
  "ux_dom.dom.src.dom1core",
  "ux_dom.dom.src.ext",
  "ux_dom.dom.src.htmltags",
  "ux_dom.dom.src.svgtags",
  "ux_dom.dom.src.csstags",
  "ux_dom.dom.uniqueid",
]
symbols = [
  "ux_dom.dom.src.dom_tag:dom_tag",
  "ux_dom.dom.src.dom_tag:get_current",
  "ux_dom.dom.src.dom_tag:attr",
  "ux_dom.dom.src.ext:Tags",
  "ux_dom.dom:div",
]
tests = [
  "tests/01_core/test_membership_contract.py",
  "tests/01_core/test_tree_ownership.py",
  "tests/01_core/test_contextvar_stack.py",
  "tests/07_resilience/test_single_tag_registry.py",
]
docs = ["docs/internals/MEMBERSHIP.md", "docs/internals/MEMORY_TREE.md", "docs/internals/CORE.md"]

